name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example --project-name cube_editor .
          fi
      - name: Add audio permissions to AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          perms = ('    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n'
                   '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n')
          if 'READ_MEDIA_AUDIO' not in s:
              s = s.replace('<application', perms + '    <application', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Get packages
        run: flutter pub get
      - name: Patch legacy audio plugin for modern Android Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          cache = Path(os.environ.get('PUB_CACHE', Path.home() / '.pub-cache'))
          roots = [cache / 'hosted' / 'pub.dev', cache / 'hosted' / 'pub.dartlang.org']
          matches = []
          for root in roots:
              if root.exists():
                  matches.extend(root.glob('on_audio_query_android-*/android/build.gradle'))

          for gradle in matches:
              source = gradle.read_text(encoding='utf-8')
              # This archived plugin pins compileSdk 33, which is too old for its AndroidX dependencies.
              import re
              source, sdk_updates = re.subn(r'(compileSdkVersion\s+)\d+', r'\g<1>35', source)
              if sdk_updates == 0:
                  source, sdk_updates = re.subn(r'(compileSdk\s+)\d+', r'\g<1>35', source)
              if sdk_updates == 0:
                  source = source.replace('android {', 'android {\n    compileSdkVersion 35', 1)
              if 'namespace' not in source:
                  source = source.replace(
                      'android {',
                      "android {\n    namespace 'com.lucasjosino.on_audio_query'",
                      1,
                  )
              if 'compileOptions' not in source:
                  source = source.replace(
                      'android {',
                      "android {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }",
                      1,
                  )
              else:
                  source = source.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
              if 'jvmTarget' not in source:
                  source = source.replace(
                      'android {',
                      "android {\n    kotlinOptions { jvmTarget = '17' }",
                      1,
                  )
              gradle.write_text(source, encoding='utf-8')
              print(f'Patched {gradle}')
          if not matches:
              print('No legacy on_audio_query_android Gradle file found; continuing.')
          PY
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cube-editor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
